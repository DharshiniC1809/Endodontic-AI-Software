name: Endodontic AI — Security Review & SAST Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Fail the workflow only when Critical findings are detected
# (Semgrep and Trivy exit codes are checked explicitly)

jobs:
  # ════════════════════════════════════════════════════════
  # JOB 1: Detect backend technology
  # ════════════════════════════════════════════════════════
  detect-stack:
    name: Detect Backend Technology
    runs-on: ubuntu-latest
    outputs:
      is-node: ${{ steps.detect.outputs.is-node }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect stack
        id: detect
        run: |
          if [ -f "backend/package.json" ]; then
            echo "is-node=true" >> $GITHUB_OUTPUT
            echo "Detected: Node.js / Express backend"
          else
            echo "is-node=false" >> $GITHUB_OUTPUT
          fi

  # ════════════════════════════════════════════════════════
  # JOB 2: Secret scanning with Gitleaks
  # ════════════════════════════════════════════════════════
  secret-scan:
    name: Gitleaks — Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Report but do not block on secret findings alone

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════
  # JOB 3: SAST with Semgrep
  # ════════════════════════════════════════════════════════
  sast-semgrep:
    name: Semgrep — Static Code Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST (Node.js / Express ruleset)
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/secrets" \
            --json \
            --output semgrep-results.json \
            backend/ || SEMGREP_EXIT=$?

          # Count critical findings
          CRITICAL=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('semgrep-results.json'))
            high = [r for r in d.get('results',[]) if r.get('extra',{}).get('severity','') in ('ERROR','CRITICAL')]
            print(len(high))
          except: print(0)
          ")
          echo "SEMGREP_CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "Critical / High findings: $CRITICAL"

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Fail on Critical SAST findings
        run: |
          if [ "$SEMGREP_CRITICAL" -gt "0" ]; then
            echo "::error::Semgrep found $SEMGREP_CRITICAL Critical/High severity findings. Fix before merging."
            exit 1
          fi

  # ════════════════════════════════════════════════════════
  # JOB 4: Dependency scanning with Trivy
  # ════════════════════════════════════════════════════════
  dependency-trivy:
    name: Trivy — Dependency & Filesystem Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0   # We manage exit ourselves below

      - name: Count Critical CVEs and fail
        run: |
          CRITICAL_COUNT=$(python3 -c "
          import json
          try:
            d = json.load(open('trivy-results.json'))
            count = 0
            for result in d.get('Results', []):
              for v in result.get('Vulnerabilities', []):
                if v.get('Severity') == 'CRITICAL':
                  count += 1
            print(count)
          except: print(0)
          ")
          echo "Trivy Critical CVEs: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo "::error::Trivy found $CRITICAL_COUNT Critical CVEs. Remediate before merging."
            exit 1
          fi

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: trivy-results.json

  # ════════════════════════════════════════════════════════
  # JOB 5: npm audit for Node.js
  # ════════════════════════════════════════════════════════
  npm-audit:
    name: npm audit — Dependency Review
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is-node == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Run npm audit (JSON)
        run: |
          cd backend
          npm audit --json > ../npm-audit-results.json || true

      - name: Check for Critical npm vulnerabilities
        run: |
          CRITICAL=$(python3 -c "
          import json
          try:
            d = json.load(open('npm-audit-results.json'))
            meta = d.get('metadata', {}).get('vulnerabilities', {})
            print(meta.get('critical', 0))
          except: print(0)
          ")
          echo "npm audit Critical: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::npm audit found $CRITICAL Critical vulnerabilities."
            exit 1
          fi

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-results.json

  # ════════════════════════════════════════════════════════
  # JOB 6: Publish GitHub Actions Summary
  # ════════════════════════════════════════════════════════
  publish-summary:
    name: Publish Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-semgrep, dependency-trivy, npm-audit]
    if: always()
    steps:
      - name: Write Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🛡️ Endodontic AI Backend — Security Audit Summary

          | Scanner | Status |
          |---|---|
          | 🔍 Gitleaks Secret Scanner | ${{ needs.secret-scan.result }} |
          | 🔬 Semgrep SAST | ${{ needs.sast-semgrep.result }} |
          | 📦 Trivy Dependency Scan | ${{ needs.dependency-trivy.result }} |
          | 🔧 npm audit | ${{ needs.npm-audit.result }} |

          ### ⚠️ Known Static Findings (from Code Review)

          | ID | Severity | Issue |
          |---|---|---|
          | SEC-001 | 🔴 Critical | Plaintext password storage — use bcrypt |
          | SEC-002 | 🔴 Critical | No authentication on protected routes — add JWT middleware |
          | SEC-003 | 🔴 Critical | IDOR on /api/analysis/history/:userId |
          | SEC-004 | 🔴 Critical | Email credentials in .env committed to repo |
          | SEC-005 | 🟠 High | Mass assignment via req.body in saveAnalysis |
          | SEC-006 | 🟠 High | Password reset bypasses OTP verification |
          | SEC-007 | 🟠 High | OTP not invalidated after successful verification |
          | SEC-008 | 🟠 High | No rate limiting on auth endpoints |
          | SEC-009 | 🟡 Medium | Wildcard CORS (all origins) |
          | SEC-010 | 🟡 Medium | Missing HTTP security headers (helmet not used) |

          > **Score: 31 / 100** — Do not deploy to production without addressing Critical findings.
          EOF
