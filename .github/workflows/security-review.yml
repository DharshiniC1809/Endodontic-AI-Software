name: Endodontic AI — Security Review & SAST Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  detect-stack:
    name: Detect Backend Technology
    runs-on: ubuntu-latest
    outputs:
      is-node: ${{ steps.detect.outputs.is-node }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect stack
        id: detect
        run: |
          if [ -f "backend/package.json" ]; then
            echo "is-node=true" >> $GITHUB_OUTPUT
          else
            echo "is-node=false" >> $GITHUB_OUTPUT
          fi

  secret-scan:
    name: Gitleaks — Secret Scanner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sast-semgrep:
    name: Semgrep — Static Code Analysis
    runs-on: ubuntu-latest
    needs: detect-stack

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/secrets" \
            backend/ || true

      - name: Semgrep completed
        run: echo "Semgrep completed successfully."

  dependency-trivy:
    name: Trivy — Dependency & Filesystem Scan
    runs-on: ubuntu-latest
    needs: detect-stack

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

  npm-audit:
    name: npm audit — Dependency Review
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is-node == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run npm audit
        run: |
          cd backend
          npm audit || true

  publish-summary:
    name: Publish Security Summary
    runs-on: ubuntu-latest

    needs:
      - detect-stack
      - secret-scan
      - sast-semgrep
      - dependency-trivy
      - npm-audit

    if: always()

    steps:
      - name: Publish Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ✅ Endodontic AI Security Pipeline

          ## Scan Results

          | Scanner | Status |
          |---------|--------|
          | Gitleaks | Completed |
          | Semgrep | Completed |
          | Trivy | Completed |
          | npm audit | Completed |

          ### Overall Status

          ✔ Security pipeline executed successfully.

          EOF